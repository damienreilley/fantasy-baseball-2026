name: Build pack lookup checklists
on:
  push:
    paths:
      - '.github/workflows/build-pack-lookups.yml'
      - 'card-lookup/build_data.py'
      - 'card-lookup/build_offline.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install beautifulsoup4
      - name: Extract verified product card numbers
        run: python card-lookup/build_data.py
      - name: Build self-contained offline lookup
        run: python card-lookup/build_offline.py
      - name: Publish retrieved checklists
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add card-lookup/data/*.json card-lookup/Pack_Room_Offline_All_Seven.html
          if ! git diff --cached --quiet; then
            git commit -m "Refresh source-attributed lookups and seven-product offline backup"
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
              sleep 2
            done
            exit 1
          fi
