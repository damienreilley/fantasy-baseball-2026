name: Build pack lookup checklists
on:
  push:
    paths:
      - '.github/workflows/build-pack-lookups.yml'
      - 'card-lookup/build_data.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install beautifulsoup4
      - name: Extract verified product card numbers
        run: python card-lookup/build_data.py
      - name: Publish retrieved checklists
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add card-lookup/data/*.json
          if ! git diff --cached --quiet; then git commit -m "Add 2025 Chrome Update, 2026 Pulse and Panini pack lookup records"; git push; fi
