name: Pack Room Production Smoke Check
on:
  push:
    paths:
      - '.github/workflows/qa-pack-room-smoke.yml'
      - 'card-lookup/qa-smoke.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node card-lookup/qa-smoke.mjs
