name: Validate Stadium Club Official Base
on:
  workflow_dispatch:
  push:
    paths:
      - 'card-lookup/audit_stadium.py'
      - '.github/workflows/audit-stadium.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pymupdf
      - name: Match 200 base card numbers and players to official Topps checklist
        run: python card-lookup/audit_stadium.py
