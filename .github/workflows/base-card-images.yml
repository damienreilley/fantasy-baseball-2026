name: Cache base-card photos
on:
  workflow_dispatch:
  push:
    paths:
      - 'card-lookup/cache_base_photos.py'
      - '.github/workflows/base-card-images.yml'
permissions:
  contents: write
concurrency:
  group: cache-base-card-images
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow requests
      - name: Retrieve and validate actual card images
        run: python card-lookup/cache_base_photos.py
      - name: Publish images for offline webpage
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add card-lookup/media/base-cards
          if ! git diff --cached --quiet; then
            git commit -m "Cache sourced 2025-2026 base card examples"
            for n in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
              sleep 2
            done
            exit 1
          fi
