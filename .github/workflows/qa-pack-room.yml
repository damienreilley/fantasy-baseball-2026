name: Pack Room End-to-End QA
on:
  workflow_dispatch:
  push:
    paths:
      - 'card-lookup/qa.mjs'
      - '.github/workflows/qa-pack-room.yml'
jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Verify search, save, export, phone navigation and offline use
        run: node card-lookup/qa.mjs
